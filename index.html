<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5f2" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Makely is a production product customizer — design on real print areas, preview in 3D, export print-ready files at 300 DPI."
    />
    <meta property="og:title" content="Makely — put your artwork on anything" />
    <meta
      property="og:description"
      content="A production customizer, not a mockup toy. Real print areas, live 3D preview, 300 DPI output."
    />
    <meta property="og:type" content="website" />
    <title>Makely — Put your artwork on anything</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Inter (UI) + Playfair Display (the single editorial accent) are needed on
      first paint. The rest are design-canvas faces the user picks from.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Pacifico&family=Bebas+Neue&family=Lobster&family=Montserrat:wght@400;600;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Pacifico&family=Bebas+Neue&family=Lobster&family=Montserrat:wght@400;600;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
