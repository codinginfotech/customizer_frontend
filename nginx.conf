# Rendered by the nginx image's entrypoint with envsubst. Only defined env vars
# are substituted (${PORT}, ${API_UPSTREAM}, ${NGINX_LOCAL_RESOLVERS}); nginx's own
# $variables are left alone.
# Shop domain allowed to frame /shopify/admin, taken from ?shop= (the admin
# always passes it; the SPA keeps it on its links). Malformed values fall back
# to the wildcard. This file is included inside http{}, so map is allowed.
map $arg_shop $cpd_frame_shop {
  default "*.myshopify.com";
  "~^[a-z0-9][a-z0-9-]*\.myshopify\.com$" $arg_shop;
}

server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve the API host lazily (every 10s) instead of once at startup, so this
  # container comes up before the API does and follows the API across redeploys.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=on;
  set $api_upstream ${API_UPSTREAM};

  # SPA fallback. The two /shopify locations serve index.html in place (not via
  # a try_files fallback, which would re-enter "location /" and lose their
  # headers). Framing policy:
  #   /shopify/admin      framed by the Shopify admin (shop domain from ?shop=)
  #   /shopify/customize  framed by any merchant storefront (anonymous page)
  #   everything else     same-origin only
  location / {
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    try_files $uri $uri/ /index.html;
  }
  location /shopify/admin {
    # Shopify wants the specific shop domain in frame-ancestors; $cpd_frame_shop
    # is derived from ?shop= by the map above (no "if" here — an if that
    # matches would discard try_files and 404 the SPA route).
    add_header Content-Security-Policy "frame-ancestors https://$cpd_frame_shop https://admin.shopify.com" always;
    try_files /index.html =404;
  }
  location /shopify/customize {
    add_header Content-Security-Policy "frame-ancestors *" always;
    try_files /index.html =404;
  }

  # Proxy API + uploaded files to the backend service so the browser only ever
  # talks to this origin (keeps the refresh cookie first-party, no CORS).
  # API_UPSTREAM may be a private http:// host or a public https:// URL: the
  # Host header is the upstream's own (so a hosting edge routes correctly) and
  # SNI is sent for TLS. With a variable upstream nginx forwards the original
  # URI unchanged.
  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 60m;
  }
  location /uploads/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host $host;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
